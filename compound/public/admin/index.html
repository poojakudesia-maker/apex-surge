<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeapPath Admin</title>
<style>
  :root{--bg:#0f1116;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--ink:#eceef2;--muted:#9ba5b4;--brand:#8a6dff;--grow:#22c79a;--danger:#f06d6d}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  a{color:var(--brand)}
  .wrap{display:flex;min-height:100vh}
  .side{width:210px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;flex:none;position:sticky;top:0;height:100vh}
  .brand{font-weight:800;font-size:18px;padding:6px 10px 18px;display:flex;align-items:center;gap:8px}
  .brand .m{width:26px;height:26px;border-radius:7px;display:block}
  .nav button{width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:11px 12px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;margin-bottom:2px}
  .nav button.on,.nav button:hover{background:var(--panel2);color:var(--ink)}
  .main{flex:1;padding:26px 30px;max-width:1000px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:24px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .stat .n{font-size:26px;font-weight:800}.stat .l{color:var(--muted);font-size:12px;margin-top:2px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  .row-actions button{margin-right:6px}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .btn.dng{background:transparent;color:var(--danger);border:1px solid var(--line)}
  .btn.sm{padding:6px 10px;font-size:12px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  select,input,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;width:100%}
  textarea{min-height:64px;resize:vertical}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:600}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal.open{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px}
  .sheet h3{margin:0 0 12px}
  .opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .opt-row input[type=text]{flex:1}
  .opt-row label{margin:0;color:var(--ink);display:flex;gap:5px;align-items:center;white-space:nowrap}
  .pill{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700}
  .pill.sub{background:rgba(240,160,60,.18);color:#f0a052}.pill.rev{background:rgba(34,199,154,.18);color:var(--grow)}
  .login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
  .err{color:var(--danger);min-height:18px;font-size:12px;margin-top:6px}
  .muted{color:var(--muted)}
.rv{margin-bottom:12px}.rv details{margin-top:8px}.rv summary{cursor:pointer;font-weight:600;font-size:13.5px}
.rv p,.rv ol{font-size:13.5px;line-height:1.5}.rvact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body>
<div id="root"><div class="login"><p class="muted">Loading…</p></div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="../assets/js/config.js"></script>
<script src="admin.js"></script>
</body>
</html>
